name: Clear Discord Chat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database from data branch
        run: |
          mkdir -p data
          git fetch origin data 2>/dev/null || true
          git show origin/data:data/deals.db > data/deals.db 2>/dev/null || true

      - name: Purge Discord Messages
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/clear_discord_chat.py
